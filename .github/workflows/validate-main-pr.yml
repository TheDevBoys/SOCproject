name: Validate Main Pull Request

on:
  pull_request:
    branches:
      - main

jobs:
  validate-source-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check source branch
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if [[ "$SOURCE_BRANCH" != "Test/Production" ]]; then
            echo "Only test/production can merge into main."
            exit 1
          fi

          echo "Valid source branch."